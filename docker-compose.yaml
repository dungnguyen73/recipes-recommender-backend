version: "3.9"

services:
  inference-server:
    container_name: inference-server
    image: roboflow/roboflow-inference-server-cpu:latest
    read_only: true
    ports:
      - "9001:9001"
    volumes:
      - "${HOME}/.inference/cache:/tmp:rw"
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
